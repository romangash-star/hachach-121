<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<!-- the game's own viewport meta, verbatim. viewport-fit=cover is required or
     env(safe-area-inset-*) reports 0 whatever the device actually has. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Viewport probe</title>

<!-- THE GAME'S OWN STYLESHEETS, in the game's own order. The point of this
     page is to measure a REAL .stage — one styled by the rules in the file
     rather than by a copy of them that could drift. The div below is the
     game's stage in everything but its contents. -->
<link rel="stylesheet" href="styles/hachach.css">
<link rel="stylesheet" href="proto.css">

<style>
  /* the readout only. Nothing here touches html, body or .stage — those are
     whatever proto.css says they are, which is the measurement. */
  .pr{ position:relative; z-index:5; margin:auto; width:100%; max-width:340px;
       max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;
       font:14px/1.5 ui-monospace,'SF Mono',Menlo,Consolas,monospace; color:#EFECE4; }
  .pr table{ border-collapse:collapse; width:100%; background:rgba(0,0,0,.5);
       border-radius:10px; overflow:hidden; }
  .pr td{ padding:9px 11px; border-bottom:1px solid rgba(255,255,255,.10);
       font-variant-numeric:tabular-nums; }
  .pr tr:last-child td{ border-bottom:0; }
  .pr td:first-child{ color:#BEB9AC; font:12px/1.35 system-ui,sans-serif; }
  .pr td:last-child{ text-align:right; font-weight:600; }
  .pr .v{ color:#FFD60A; }
  .pr button{ display:block; width:100%; margin-top:12px; padding:15px 12px;
       font:700 16px/1 system-ui,sans-serif; color:#131310; background:#FFD60A;
       border:0; border-radius:12px; box-shadow:0 3px 0 #C6A800; }
  .pr button:active{ transform:translateY(2px); box-shadow:0 1px 0 #C6A800; }
  .pr textarea{ width:100%; margin-top:10px; box-sizing:border-box; height:132px;
       background:rgba(0,0,0,.55); color:#EFECE4; border:1px solid rgba(255,255,255,.18);
       border-radius:10px; padding:9px; font:12px/1.5 ui-monospace,Menlo,monospace; }
  /* the two elements env() is read off. Never displayed. */
  .pr-env{ position:absolute; left:-9999px; top:0; width:1px; }
  .pr-env i{ display:block; }
  .pr-env .t{ height:env(safe-area-inset-top, 0px); }
  .pr-env .b{ height:env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>

<!-- a real .stage, styled by the real proto.css -->
<div class="stage" id="stage">
  <div class="pr">
    <table><tbody id="rows"></tbody></table>
    <button type="button" id="copy">Copy</button>
    <textarea id="out" readonly></textarea>
  </div>
  <span class="pr-env" aria-hidden="true"><i class="t"></i><i class="b"></i></span>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var envT  = document.querySelector('.pr-env .t');
  var envB  = document.querySelector('.pr-env .b');

  function px(n){ return (Math.round(n * 10) / 10) + 'px'; }

  function read(){
    var cs = getComputedStyle(document.body);
    var vv = window.visualViewport;
    return [
      ['.stage rect.top',        px(stage.getBoundingClientRect().top)],
      ['body align-items / flex-direction', cs.alignItems + ' / ' + cs.flexDirection],
      ['safe-area-inset top / bottom',
        px(envT.getBoundingClientRect().height) + ' / ' + px(envB.getBoundingClientRect().height)],
      ['visualViewport.scale',   vv ? vv.scale : 'no visualViewport']
    ];
  }

  function paint(){
    var d = read(), html = '', i;
    for (i = 0; i < d.length; i++)
      html += '<tr><td>' + d[i][0] + '</td><td class="v">' + d[i][1] + '</td></tr>';
    document.getElementById('rows').innerHTML = html;
    /* the UA rides in the COPIED text only, never on screen: the last paste
       came back from CriOS and we could not tell until it was read. */
    var lines = ['VIEWPORT PROBE', navigator.userAgent, ''];
    for (i = 0; i < d.length; i++) lines.push(d[i][0] + ': ' + d[i][1]);
    document.getElementById('out').value = lines.join('\n');
  }

  document.getElementById('copy').addEventListener('click', function(){
    var ta = document.getElementById('out'), btn = this;
    function done(){ btn.textContent = 'Copied'; setTimeout(function(){ btn.textContent = 'Copy'; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, function(){ ta.select(); });
    } else {
      ta.removeAttribute('readonly'); ta.select();
      if (ta.setSelectionRange) ta.setSelectionRange(0, 99999);
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.setAttribute('readonly', '');
    }
  });

  paint();
  addEventListener('resize', paint);
  addEventListener('orientationchange', function(){ setTimeout(paint, 300); });
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', paint);
    visualViewport.addEventListener('scroll', paint);
  }
  /* the toolbars settle after first paint */
  setTimeout(paint, 400); setTimeout(paint, 1200); setTimeout(paint, 3000);
})();
</script>
</body>
</html>
